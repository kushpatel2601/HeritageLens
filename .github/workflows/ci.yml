name: CI

# Tests and static checks only: HeritageLens is not deployed from CI.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"
  FORCE_COLOR: "1"

jobs:
  backend:
    name: Backend (FastAPI)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        # lean + export bring onnxruntime, sentencepiece and onnx, so the lean-embedder graph tests run too.
        run: python -m pip install -e ".[dev,lean,export]"
      - name: Lint (ruff)
        run: |
          ruff check app tests ../deploy
          ruff format --check app tests ../deploy
      - name: Type-check (mypy)
        run: mypy app
      - name: Test (pytest)
        run: pytest --cov --cov-report=term
      - name: OpenAPI schema is up to date
        run: |
          python -m app.cli openapi --out ../frontend/src/lib/api/openapi.json
          git diff --exit-code -- ../frontend/src/lib/api/openapi.json \
            || (echo "::error::Run 'python -m app.cli openapi' and 'npm run gen:api' and commit the result." && exit 1)

  gpu-worker:
    name: GPU worker (heritage_gpu)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            ml/pyproject.toml
      # The backend is installed too, so the worker-server contract test runs against the real API.
      - name: Install
        run: python -m pip install -e ".[dev]" -e "../backend[dev]"
      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Type-check (mypy)
        run: mypy heritage_gpu
      - name: Test (pytest, model-free)
        run: pytest

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: API types match the OpenAPI schema
        run: |
          npm run gen:api
          git diff --exit-code -- src/lib/api/schema.d.ts \
            || (echo "::error::Run 'npm run gen:api' and commit src/lib/api/schema.d.ts." && exit 1)
      - name: Lint (eslint)
        run: npm run lint
      - name: Type-check (tsc)
        run: npm run typecheck
      - name: Test (vitest)
        run: npm test
      - name: Build
        run: npm run build

# Render's free plan sleeps after 15 minutes without traffic (about a minute to wake) and restarts from
# the baked snapshot. Pinging the health check keeps the demo warm; one always-on free service fits
# inside Render's 750 free instance hours a month. Set the API_URL repository variable to enable it.
# GitHub delays scheduled runs under load, so ping at the 5-minute minimum to stay well inside 15 minutes.
name: keep-alive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the API health check
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "::notice::Set the API_URL repository variable (e.g. https://heritagelens-hc26.onrender.com) to enable."
            exit 0
          fi
          curl --fail --silent --show-error --retry 5 --retry-delay 15 --retry-all-errors --max-time 90 \
            "${API_URL%/}/api/v1/health"

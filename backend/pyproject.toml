[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "heritagelens-api"
version = "0.1.0"
description = "HeritageLens - turning unstructured cultural & architectural heritage archives into a searchable, mappable, immersive atlas."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.32",
  "aiosqlite>=0.20",
  "asyncpg>=0.29",
  "pgvector>=0.3.2",
  "alembic>=1.13",
  "python-multipart>=0.0.9",
  "numpy>=1.26",
  "pillow>=10.4",
  "pypdf>=4.3",
  "pypdfium2>=4.30",
  "python-pptx>=1.0",
  "python-docx>=1.1",
  "indic-transliteration>=2.3",
  "httpx>=0.27",
]

[project.optional-dependencies]
# Real multilingual semantic embeddings + CLIP image search on CPU (ONNX, no torch).
# sentencepiece serves the lean text model (`app.cli export-lean-model`) used on 512 MB hosts.
ml = ["fastembed>=0.4", "sentencepiece>=0.2"]
# Runtime for the lean text model only (no fastembed, tokenizers or CLIP): what the 512 MB deploy installs.
lean = ["onnxruntime>=1.17", "sentencepiece>=0.2"]
# Build-time only: `app.cli export-lean-model` rewrites the ONNX graph.
export = ["onnx>=1.16"]
# S3 / MinIO object storage.
s3 = ["boto3>=1.34"]
# Local Tesseract OCR fallback (requires the tesseract binary with hin/guj traineddata).
ocr = ["pytesseract>=0.3.13"]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.scripts]
heritagelens = "app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF", "N"]
ignore = ["B008", "RUF001", "RUF002", "RUF003", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "N802"]

[tool.mypy]
python_version = "3.12"
strict_optional = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/", "tests/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
    # starlette's TestClient nudges towards httpx2; httpx is what FastAPI's docs and our CI pin.
    "ignore:Using .httpx. with .starlette.testclient. is deprecated",
]

[tool.coverage.run]
source = ["app"]
# SQLAlchemy's async engine resumes route code inside greenlets; without this, coverage under-reports.
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
skip_covered = true
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "if __name__ == .__main__.:"]

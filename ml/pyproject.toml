[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "heritage-gpu"
version = "0.1.0"
description = "HeritageLens GPU worker - pulls OCR, translation, captioning and 3D-reconstruction jobs from the HeritageLens API over outbound HTTPS (built for free Colab T4 / P100 / A100 GPUs)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# The core (protocol client, runner, geometry, fake engines) only needs these three.
dependencies = ["httpx>=0.27", "numpy>=1.26", "pillow>=10.4"]

[project.optional-dependencies]
# Real models. Colab images already ship torch / transformers / accelerate / sentencepiece.
models = [
  "torch>=2.3",
  "transformers>=4.49",
  "accelerate>=0.33",
  "sentencepiece>=0.2",
  "pytesseract>=0.3.13",
]
# AI4Bharat IndicTrans2 pre/post-processing (preferred Indic->English translator when installed).
indictrans = ["IndicTransToolkit>=1.0.3"]
# Multi-view reconstruction: COLMAP structure-from-motion + gsplat Gaussian splatting (CUDA).
multiview = ["pycolmap>=3.10", "gsplat>=1.4"]
dev = ["pytest>=8.3", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
heritage-gpu = "heritage_gpu.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["heritage_gpu"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N"]
ignore = ["N803", "N806"]  # K, R, H, W are conventional names in camera / geometry maths

[tool.ruff.lint.isort]
known-first-party = ["heritage_gpu"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
ignore_missing_imports = true
exclude = ["tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:asyncio"
filterwarnings = [
    # The contract test drives the backend through starlette's TestClient, which nudges towards httpx2.
    "ignore:Using .httpx. with .starlette.testclient. is deprecated",
]
